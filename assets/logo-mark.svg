<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="codebase-rag">
  <title>codebase-rag</title>
  <!-- Mark: three indexed chunks feeding into a prompt chevron.
       Single color via currentColor so it inherits theme. -->
  <g fill="currentColor">
    <rect x="8"  y="18" width="20" height="4" rx="1.5"/>
    <rect x="8"  y="30" width="14" height="4" rx="1.5"/>
    <rect x="8"  y="42" width="18" height="4" rx="1.5"/>
  </g>
  <path d="M34 16 L52 32 L34 48"
        fill="none" stroke="currentColor" stroke-width="5"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
