[project]
name = "codebase-rag"
version = "0.1.0"
description = "Local codebase RAG with Ollama + mistral-nemo"
requires-python = ">=3.10"
dependencies = [
    "ollama>=0.3.0",
    "chromadb>=0.5.0",
]

[project.optional-dependencies]
web = [
    "httpx>=0.27",
    "trafilatura>=2.0",
]
cloud = [
    "anthropic>=0.45",
]
tui = [
    "textual>=0.80",
]
serve = [
    "starlette>=0.37",
    "uvicorn[standard]>=0.30",
    "websockets>=12.0",
]
dev = [
    "ruff>=0.8",
]

[project.scripts]
codebase-rag = "codebase_rag.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["codebase_rag"]
include-package-data = true

[tool.setuptools.package-data]
codebase_rag = ["*.tcss"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
    "design",
    "designs",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",  # line length is handled by formatter where practical
    "B904",  # explicit exception chaining is useful but too noisy for baseline adoption
    "B905",  # existing zip calls intentionally accept shortest-iterable semantics
]

[tool.ruff.lint.isort]
known-first-party = ["codebase_rag"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
