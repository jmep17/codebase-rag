[project]
name = "codebase-rag"
version = "0.1.0"
description = "Local codebase RAG with Ollama + mistral-nemo"
requires-python = ">=3.10"
dependencies = [
    "ollama>=0.3.0",
    "chromadb>=0.5.0",
]

[project.optional-dependencies]
web = [
    "httpx>=0.27",
    "trafilatura>=2.0",
]
cloud = [
    "anthropic>=0.45",
]
tui = [
    "textual>=0.80",
]
serve = [
    "starlette>=0.37",
    "uvicorn[standard]>=0.30",
    "websockets>=12.0",
]

[project.scripts]
codebase-rag = "codebase_rag.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["codebase_rag"]
include-package-data = true

[tool.setuptools.package-data]
codebase_rag = ["*.tcss"]
